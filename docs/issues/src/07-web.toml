priority = "P0"
workstream = "frontend"
owner_role = "Design/frontend"
depends_on = []
problem = """Comparing a score with the dataset label is part of the workflow, but labels must be hidden by default and fetched separately so they cannot influence or be confused with predictions."""
outcome = """Per-finding 'Reveal dataset label' action per DESIGN.md §9.10 fetching /studies/{id}/labels on demand, showing state and provenance, reset on study change."""
