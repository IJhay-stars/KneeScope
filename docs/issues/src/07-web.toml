dod = ["Manual keyboard-only walkthrough recorded in PR."]

[[issue]]
id = "KS-WEB-03"
title = "Findings panel: run analysis, five finding states and result provenance"
epic = "KS-EPIC-WEB"
type = "task"
priority = "P0"
workstream = "frontend"
owner_role = "Design/frontend"
depends_on = []
problem = """Reviewers must be able to tell scored, not evaluated, unavailable, unsupported and failed apart, and live, cached and fixture results apart, without relying on colour."""
outcome = """Findings column per DESIGN.md §9.6–9.8 and §11: run-analysis button with step/elapsed status and aria-live announcements; finding rows driven by the active profile; provenance strip with LIVE/CACHED/FIXTURE treatments; study-level errors as 'Analysis failed' with code and request_id."""
scope = ["Run analysis with disabled state while running and 'Run again' after.", "All five states with glyph + text; score bar never coloured by value.", "Threshold text only when threshold exists.", "Provenance strip fields: source badge, model version, checkpoint short SHA, preprocessing version, computed/served time, latency for live only.", "Fixture hatch stripe on rows and viewer frame."]
exclusions = ["Explanation panel (KS-WEB-05).", "Label reveal (KS-WEB-04)."]
guidance = """Drive tests from contracts/examples/*.json. For cached and live states, construct test-only responses inside tests (validated shapes), never ship them as fixtures."""
files = ["web/src/components/findings/", "web/src/pages/ReviewPage.tsx"]
contract_impact = "None (PredictionResponse)."
design_refs = ["DESIGN.md §9.6 Run analysis", "DESIGN.md §9.7 Provenance strip", "DESIGN.md §9.8 Finding row", "DESIGN.md §11 Result and finding states"]
acceptance = ["Test: a score of 0.07 renders as scored ('0.07'), with no 'failed' or 'unavailable' text.", "Test: each status renders its distinct text ('Not evaluated', 'Unavailable — …', 'Not supported by this model', 'Analysis failed — <code>').", "Test: fixture response shows 'FIXTURE — not a model output'; cached shows 'CACHED' with the original timestamp and no latency; live shows 'LIVE' with latency.", "Test: HTTP 422 PREPROCESSING_FAILED shows 'Analysis failed' and no scores.", "aria-live region announces start and completion (test)."]
verification = ["pnpm --dir web test"]
docs = ["DESIGN.md §11 if states change"]
dod = ["Screenshots of all five states in the PR."]

[[issue]]
