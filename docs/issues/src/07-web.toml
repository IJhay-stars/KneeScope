[[issue]]
id = "KS-WEB-01"
title = "Study browser: filter, sort, responsive list and all states"
epic = "KS-EPIC-WEB"
type = "task"
priority = "P0"
workstream = "frontend"
owner_role = "Design/frontend"
depends_on = []
problem = """The scaffold renders a basic study table. The study browser must match DESIGN.md §9.3 and §15 including filtering, keyboard navigation, the <600px card list, and loading/empty/error states."""
outcome = """Studies page complete per DESIGN.md §9.3, §10, §15, §16, working against fixture mode and (later) model mode without changes."""
scope = ["Filter by study ID, sort by ID.", "Rows are links (keyboard Enter), with accessible names including plane availability and analysis status.", "Card list below 600px.", "Loading (flat skeleton, aria-busy), empty (no permitted studies), error (code, request_id, retry)."]
