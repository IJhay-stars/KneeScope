contract_impact = "None (StudyList)."
design_refs = ["DESIGN.md §9.3 Study table", "DESIGN.md §10 states", "DESIGN.md §15 responsive", "DESIGN.md §16 accessibility"]
acceptance = ["Component tests: loading, empty (studies: []), error (ApiError body with retryable true shows Retry), and populated states each render the specified text.", "Missing plane slot has accessible text '<plane> missing' (test).", "At 375px width there is no horizontal page scroll (manual screenshot in PR).", "Keyboard: Tab to a row and Enter opens /studies/:id (test)."]
