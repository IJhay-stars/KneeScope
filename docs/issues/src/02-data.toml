[[issue]]
id = "KS-DATA-05"
title = "Dataset adapter: study listing, plane assignment, series selection and slice ordering"
epic = "KS-EPIC-DATA"
type = "task"
priority = "P0"
workstream = "data"
owner_role = "Data/preprocessing"
depends_on = ["KS-DATA-04"]
problem = """Model input and the viewer need a deterministic mapping from the selected dataset to SeriesVolume objects: which series belong to which plane, which one series per plane feeds the model, and slice order by spatial position rather than filename."""
outcome = """ml/kneescope_ml/adapters/<dataset>.py implements DatasetAdapter (list_studies, list_series, load_series, select_series) with slice_order 'patient_position' derived from ImagePositionPatient projected on the slice normal, and a documented series-selection rule."""
scope = ["Implement the adapter for the selected dataset.", "Plane from dataset metadata (RSNA Anatomical_Plane) cross-checked with ImageOrientationPatient; disagreement → warning and plane=None.", "Series selection rule per plane (e.g. prefer fluid-sensitive, fat-suppressed; tie-break by slice count) documented in docstring and data-audit.md.", "Rescale slope/intercept applied; no flipping."]
exclusions = ["Corrupt-file and transfer-syntax robustness (KS-DATA-06).", "Normalisation and resizing (preprocess module)."]
