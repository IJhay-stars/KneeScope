contract_impact = "Produces SeriesVolume per contracts/README.md §2–§3. No schema change."
acceptance = ["Unit tests on synthetic DICOMs (generated in the test with pydicom) prove ordering by position when filenames and InstanceNumber are shuffled.", "Test proves a plane mismatch yields plane=None and a warning.", "select_series returns at most one series per plane and follows the documented rule on a fixture with two sagittal series.", "Adapter module has no import of kneescope_ml.labels (enforced by tests/test_label_isolation.py)."]
