[[issue]]
id = "KS-DATA-03"
title = "Audit the accessible dataset(s): studies, series, planes, labels and grouping identifiers"
epic = "KS-EPIC-DATA"
type = "task"
priority = "P0"
workstream = "data"
owner_role = "Data/preprocessing"
depends_on = ["KS-DATA-01", "KS-DATA-02"]
problem = """Choosing findings and splits requires facts: how many studies have labels, per-finding positive/negative/unknown counts, which planes exist, file formats and transfer syntaxes, and whether patient or site identifiers support grouped evaluation. For RSNA only a small labelled subset exists; the remaining studies have multilingual reports only."""
outcome = """docs/data-audit.md §2–§6 completed for every dataset with verified access, produced by a committed script (scripts/audit_dataset.py) whose output JSON is saved under artifacts/audit/ (untracked) and summarised in the doc."""
scope = ["Count studies, series per study, planes per study (Anatomical_Plane), slices per series, transfer syntaxes, corrupt/unreadable files.", "Per candidate finding: positive, negative, unknown/missing counts in the labelled subset.", "Whether PatientID or site can be derived for grouping; if not, state it.", "Disk size and download time for the subset to be used."]
exclusions = ["No model training.", "No report text copied into the repository or issue."]
guidance = """Read train.csv/train_series.csv (RSNA) with pandas or csv; open a sample of DICOMs with pydicom (+ pylibjpeg for JPEG Lossless/2000). Keep all outputs outside git (artifacts/ is ignored). Report counts only — no UIDs or report text in committed docs."""
files = ["scripts/audit_dataset.py", "docs/data-audit.md"]
contract_impact = "Provides evidence for the finding profile and preprocessing parameters; no contract change."
acceptance = ["scripts/audit_dataset.py runs on the accessible data and writes artifacts/audit/<dataset>.json.", "docs/data-audit.md has a per-finding table with positive/negative/unknown counts and the denominator (labelled studies).", "Plane availability table: count of studies with each of sagittal/coronal/axial and with none.", "Grouping section states whether patient or site identifiers exist, with the field name or 'not available'.", "Corrupt/unreadable file count and transfer-syntax breakdown are reported."]
verification = ["python scripts/audit_dataset.py --dataset <id> --root <path> --out artifacts/audit/<id>.json", "Second person reruns the script on the same subset and gets identical counts."]
docs = ["docs/data-audit.md"]
dod = ["Audit summary reviewed by the modelling and evaluation owners."]
[issue.science]
dataset = "Whichever dataset(s) KS-DATA-01/02 found accessible; record version/date of download."
partition = "Whole labelled pool (no splits yet)."
metrics = "Counts and prevalence only."
cannot_claim = "Anything about model performance; that report-only studies are labelled."
artifacts = "scripts/audit_dataset.py, artifacts/audit/<dataset>.json (untracked), summary tables in docs/data-audit.md."

