[[issue]]
id = "KS-DATA-06"
title = "Handle orientation metadata, transfer syntaxes, missing series and corrupt inputs"
epic = "KS-EPIC-DATA"
type = "task"
priority = "P0"
workstream = "data"
owner_role = "Data/preprocessing"
depends_on = ["KS-DATA-05"]
problem = """RSNA series mix Explicit/Implicit VR, JPEG Lossless and JPEG 2000, with varying orientation and resolution; some files may be unreadable. Failures must surface as structured errors, not crashes or silently wrong images."""
outcome = """The adapter decodes every transfer syntax found in the audit, records laterality and orientation without mirroring, maps failures to PREPROCESSING_FAILED / INPUT_INVALID with safe messages, and a missing required plane yields 'unavailable' findings."""
scope = ["Add decoders (pylibjpeg/openjpeg or gdcm) to the ml extra and lock.", "Detect corrupt or inconsistent series (missing slices, mixed dimensions) and raise PreprocessingError with a reviewer-safe message.", "Record laterality and orientation metadata in SeriesVolume for display labels.", "Tests for each failure path."]
exclusions = ["No image mirroring to a canonical side."]
guidance = """Messages must not include file paths or UIDs. Mixed rows/cols within a series is an error unless a documented resample rule is chosen."""
files = ["ml/kneescope_ml/adapters/", "ml/kneescope_ml/preprocess.py", "pyproject.toml", "uv.lock", "tests/ml/"]
contract_impact = "May add optional orientation fields to SeriesSummary (additive, minor schema bump) — follow the contract change procedure if so."
acceptance = ["A test per transfer syntax present in the audit decodes a generated or permitted sample.", "Tests: truncated file, mixed slice dimensions, zero slices → PreprocessingError with a message containing no path.", "A study missing the required plane produces findings with status 'unavailable' and reason code INPUT_INVALID through the API test client.", "No code path flips pixel arrays (grep check in test)."]
verification = ["uv sync --extra ml && pytest tests/ml", "pytest tests/api -k unavailable"]
docs = ["contracts/README.md §4 if orientation fields are added", "docs/data-audit.md"]
dod = ["Audit's corrupt-file count reconciled with adapter failures."]

