[[issue]]
id = "KS-DATA-01"
title = "Verify RSNA Knee data access and permitted training, hosting, demo and recording uses"
epic = "KS-EPIC-DATA"
type = "decision"
priority = "P0"
workstream = "data"
owner_role = "Data/preprocessing (human decision; each data handler accepts rules personally)"
depends_on = []
problem = """The RSNA Knee Abnormality Detection rules (read 2026-10-13) permit use of the competition data 'for any purpose … including academic research and education' subject to the MIRA license, but also require participants not to 'redistribute or otherwise provide or make available the Competition Data to any party not participating in the Competition'. Access requires each person to accept the rules before the entry deadline (15 October 2026, 23:59 UTC). Hosting rendered slices publicly, showing them in a recorded video, or sharing a demo machine may count as making data available. The dataset is about 570 GB of DICOM, and only a small subset of training studies carry labels."""
outcome = """docs/data-audit.md §1 records, for RSNA: who has accepted the rules (names, not credentials), the MIRA license terms read (link and date), and an explicit yes/no/unclear for: training, local demo to judges, public hosting of rendered slices, recorded video showing slices, and publishing model weights. Unclear items list the question sent to informatics@rsna.org or Kaggle and its status."""
scope = ["Read the competition Rules and http://rsna.org/mira-license.", "Each team member who will download or view data accepts the rules themselves (human action).", "Answer each permitted-use question with a quoted clause.", "Record download feasibility (570 GB total; whether a subset can be fetched by study)."]
exclusions = ["Agents must not accept terms, sign in, or download data on anyone's behalf.", "Do not email organizers without the coordinator's approval of the text."]
guidance = """Quote clauses; do not paraphrase permissions into broader ones. Treat 'unclear' as 'not permitted' for public hosting and recordings until answered. Note that removing identifying tags does not grant redistribution rights."""
files = ["docs/data-audit.md", "docs/decisions.md"]
contract_impact = "None directly; feeds KS-DATA-04."
acceptance = ["docs/data-audit.md §1 'Access and permitted use' for RSNA has a row for each of: training, evaluation, local demo, public hosting, recording, weight publication — each 'yes', 'no' or 'unclear' with a quoted clause or pending question.", "The list of members who personally accepted the rules is recorded (names only).", "Download feasibility (full or per-study subset) is stated with evidence (command or page reference)."]
verification = ["Coordinator and one other member review the table against the rules page."]
docs = ["docs/data-audit.md"]
dod = ["Table complete; unclear items have an owner and a pending question."]
[issue.science]
dataset = "RSNA Knee Abnormality Detection (Kaggle, 2026), Competition Data subject to Rules §4 and the MIRA license."
partition = "Not applicable (access decision)."
metrics = "Not applicable."
cannot_claim = "That de-identification permits redistribution; that a local demo or recording is automatically permitted."
artifacts = "Dated permitted-use table in docs/data-audit.md."

