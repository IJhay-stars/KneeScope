# Optional enhancements: only after the core (P0/P1) is done and only if the owner of the
# affected workstream agrees. None of these block delivery.

[[issue]]
id = "KS-OPT-01"
title = "[Optional] Upload support for user-supplied studies"
epic = "KS-EPIC-API"
type = "optional"
priority = "P2"
workstream = "backend"
owner_role = "Backend/serving with Coordinator approval"
depends_on = ["KS-API-02", "KS-OPS-01"]
problem = """The plan lists general upload as 'add after the core works'. Uploads raise privacy, permission and robustness questions."""
outcome = """Local-only upload of a DICOM study (zip) processed through the same adapter rules, never persisted beyond the session, never logged, rejected if not de-identified per a documented check."""
scope = ["Size and type limits.", "Temporary storage with deletion.", "Same preprocessing and error mapping."]
exclusions = ["Public hosting with upload enabled.", "PHI handling claims."]
guidance = """Requires a decision entry approving it after the core is complete."""
files = ["api/kneescope_api/upload.py", "web/src/pages/UploadPage.tsx", "tests/api/test_upload.py"]
contract_impact = "Adds an upload endpoint and response (minor version)."
acceptance = ["Upload of a synthetic DICOM zip yields a temporary study that predicts via the live path (test).", "Temporary files are deleted after the session or 1 hour (test).", "Upload of a file containing PatientName is rejected (test)."]
verification = ["pytest tests/api/test_upload.py"]
docs = ["docs/security.md", "contracts/README.md"]
dod = ["Decision entry approving the feature exists."]

[[issue]]
id = "KS-OPT-02"
title = "[Optional] Reviewer notes per study"
epic = "KS-EPIC-WEB"
type = "optional"
priority = "P2"
workstream = "frontend"
owner_role = "Design/frontend"
depends_on = ["KS-WEB-03"]
problem = """Researchers may want to note observations while reviewing."""
outcome = """Local-only notes per study (browser storage), clearly separate from labels and predictions, exportable as text."""
