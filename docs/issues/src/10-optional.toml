docs = ["DESIGN.md"]
dod = ["QA reviewed wording."]

[[issue]]
id = "KS-OPT-05"
title = "[Optional] Server-side true window/level rendering"
epic = "KS-EPIC-API"
type = "optional"
priority = "P2"
workstream = "backend"
owner_role = "Backend/serving with Design/frontend"
depends_on = ["KS-API-01"]
problem = """Display adjust on PNGs is not MRI window/level. True window/level needs intensity data rendered server-side."""
outcome = """Slice endpoint accepts window centre/width in stored-value units and renders accordingly; UI labels it 'Window/level' only when this endpoint is used."""
scope = ["Query parameters with validation.", "UI control switch."]
exclusions = ["Client-side raw intensity transfer."]
guidance = """Keep 'Display adjust' as the default."""
files = ["api/kneescope_api/main.py", "ml/kneescope_ml/render.py", "web/src/components/viewer/"]
contract_impact = "Additive query parameters on the slice endpoint."
design_refs = ["DESIGN.md §14"]
acceptance = ["Rendering with a given window matches a numpy reference (test).", "UI label switches only when server window/level is active (test)."]
verification = ["pytest tests/api", "pnpm --dir web test"]
docs = ["DESIGN.md §14", "contracts/README.md §3"]
dod = ["Design spec updated."]

