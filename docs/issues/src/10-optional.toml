acceptance = ["Notes persist across reload in the same browser (test with mocked storage).", "No network request contains note text (test)."]
verification = ["pnpm --dir web test"]
docs = ["DESIGN.md (component spec)"]
dod = ["Design spec updated."]

[[issue]]
id = "KS-OPT-03"
title = "[Optional] Exploratory threshold slider per finding"
epic = "KS-EPIC-WEB"
type = "optional"
priority = "P2"
workstream = "frontend"
owner_role = "Design/frontend with Evaluation reviewer"
depends_on = ["KS-EVAL-02", "KS-WEB-06"]
problem = """PRD lists a threshold slider as 'should ship'. It helps show trade-offs but can suggest that any threshold is validated."""
outcome = """On the evaluation page only, a slider per finding showing sensitivity/specificity at the chosen threshold from precomputed validation operating points, with the validated threshold marked."""
scope = ["Operating points exported by evaluation.", "Slider on evaluation page.", "Label 'exploratory'."]
exclusions = ["Changing thresholds used by predictions in the review view."]
guidance = """Operating points come from validation only."""
files = ["web/src/components/ledger/ThresholdExplorer.tsx", "ml/kneescope_ml/evaluation.py"]
contract_impact = "Adds optional operating_points to FindingMetrics (minor version)."
design_refs = ["DESIGN.md §9.11"]
acceptance = ["Slider values match exported operating points (test).", "Review-view predictions unaffected (test)."]
verification = ["pnpm --dir web test", "pytest tests/ml/test_evaluation.py"]
docs = ["DESIGN.md §9.11", "contracts/README.md §9"]
dod = ["Evaluation owner reviewed wording."]

[[issue]]
id = "KS-OPT-04"
title = "[Optional] Exportable research summary"
epic = "KS-EPIC-WEB"
type = "optional"
priority = "P2"
workstream = "frontend"
owner_role = "Design/frontend"
depends_on = ["KS-WEB-03", "KS-WEB-06"]
