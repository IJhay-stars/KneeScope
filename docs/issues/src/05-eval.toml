[[issue]]
id = "KS-EVAL-07"
science_exempt = "Caches outputs of the live path; produces no metrics."
title = "Precompute cached predictions for the demo studies with full provenance"
epic = "KS-EPIC-EVAL"
type = "task"
priority = "P1"
workstream = "evaluation"
owner_role = "Evaluation with Backend reviewer"
depends_on = ["KS-API-04", "KS-DATA-10"]
problem = """The demo needs a fallback that works without live inference, but cached results must never look fresh."""
outcome = """scripts/precompute_predictions.py runs the live path once per manifest study and stores cache entries keyed by model, checkpoint, preprocessing and profile; the API serves them with source 'cached' and original computed_at."""
scope = ["Use the API's live path (not a reimplementation).", "Store under the configured cache_dir.", "Verify each entry round-trips as source 'cached'."]
exclusions = ["Hand-editing cache entries."]
guidance = """Regenerate after any model or preprocessing version change; stale keys are cache misses by design."""
files = ["scripts/precompute_predictions.py", "tests/api/test_cache_roundtrip.py"]
contract_impact = "None (uses PredictionResponse with source 'cached')."
acceptance = ["Every manifest study has a cache entry whose provenance.source is 'cached' when served and whose computed_at precedes served_at.", "Changing preprocessing version in config makes the API miss the cache (test)."]
verification = ["python scripts/precompute_predictions.py --manifest artifacts/manifest/studies.json", "pytest tests/api/test_cache_roundtrip.py"]
docs = ["README.md 'Cached mode'", "docs/demo-script.md"]
dod = ["Demo owner has run the cached path offline."]
